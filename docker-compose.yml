services:
  traefik:
    image: traefik:v3.6
    container_name: aether-traefik

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

    networks:
      - aether-network

  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "5000"
      BASE_URL: "http://localhost"
      DATABASE_URL: "postgresql://postgres:ntxcyber73@host.docker.internal:5432/aether?schema=public"
      REDIS_URL: "redis://redis:6379"

    labels:
      - "traefik.enable=true"

      # REST API
      - "traefik.http.routers.aether-api.rule=Host(`localhost`)"
      - "traefik.http.routers.aether-api.entrypoints=web"
      - "traefik.http.routers.aether-api.service=aether-api"
      - "traefik.http.services.aether-api.loadbalancer.server.port=5000"

      # WebSocket
      - "traefik.http.routers.aether-ws.rule=Host(`ws.localhost`)"
      - "traefik.http.routers.aether-ws.entrypoints=web"
      - "traefik.http.routers.aether-ws.service=aether-ws"
      - "traefik.http.services.aether-ws.loadbalancer.server.port=8080"

    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis

    ports:
      - "6379:6379"

    networks:
      - aether-network

networks:
  aether-network:
    driver: bridge
