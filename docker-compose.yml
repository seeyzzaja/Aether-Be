services:
  traefik:
    image: traefik:v3.6
    container_name: aether-traefik

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

    networks:
      - aether-network

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aether-api

    environment:
      NODE_ENV: production
      PORT: "5000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aether-api.rule=Host(`localhost`)"
      - "traefik.http.routers.aether-api.entrypoints=web"
      - "traefik.http.services.aether-api.loadbalancer.server.port=5000"

    networks:
      - aether-network

networks:
  aether-network:
    driver: bridge
