services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
        BASE_URL: http://localhost
        DATABASE_URL: postgresql://postgres:ntxcyber73@host.docker.internal:5432/aether?schema=public
        NODE_ENV: production
        PORT: 5000
        REDIS_URL: redis://redis:6379
        CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
        CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
        CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

    labels:
      traefik.enable: "true"

      # REST API
      traefik.http.routers.aether-api.entrypoints: web
      traefik.http.routers.aether-api.rule: Host(`localhost`)
      traefik.http.routers.aether-api.service: aether-api

      # WebSocket
      traefik.http.routers.aether-ws.entrypoints: web
      traefik.http.routers.aether-ws.rule: Host(`ws.localhost`)
      traefik.http.routers.aether-ws.service: aether-ws

      # Internal app ports
      traefik.http.services.aether-api.loadbalancer.server.port: "5000"
      traefik.http.services.aether-ws.loadbalancer.server.port: "8080"

    networks:
      - aether-network

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      - npm
      - run
      - worker:email

    environment:
      BASE_URL: http://localhost
      DATABASE_URL: postgresql://postgres:ntxcyber73@host.docker.internal:5432/aether?schema=public
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379

    networks:
      - aether-network

  redis:
    container_name: aether-redis
    image: redis:7-alpine

    ports:
      - "6379:6379"

    networks:
      - aether-network

  traefik:
    container_name: aether-traefik
    image: traefik:v3.6

    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - aether-network

networks:
  aether-network:
    driver: bridge