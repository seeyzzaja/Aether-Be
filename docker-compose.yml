services:
  app:
    image: ghcr.io/seeyzzaja/aether-be
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run start"
    environment:
      BASE_URL: http://localhost
      DATABASE_URL: postgresql://postgres:ntxcyber73@postgres:5432/aether?schema=public
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}

      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}

      OAUTH_SUCCESS_REDIRECT_URL: ${OAUTH_SUCCESS_REDIRECT_URL}
      OAUTH_FAILURE_REDIRECT_URL: ${OAUTH_FAILURE_REDIRECT_URL}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
    volumes:
      - app-logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    labels:
      traefik.enable: "true"

      traefik.http.routers.aether-api.entrypoints: web
      traefik.http.routers.aether-api.rule: Host(`localhost`)
      traefik.http.routers.aether-api.service: aether-api

      traefik.http.routers.aether-ws.entrypoints: web
      traefik.http.routers.aether-ws.rule: Host(`ws.localhost`)
      traefik.http.routers.aether-ws.service: aether-ws

      traefik.http.services.aether-api.loadbalancer.server.port: "5000"
      traefik.http.services.aether-ws.loadbalancer.server.port: "8080"

    networks:
      - aether-network

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - npm
      - run
      - worker:email

    environment:
      BASE_URL: http://localhost
      DATABASE_URL: postgresql://postgres:ntxcyber73@postgres:5432/aether?schema=public
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}

      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}

      OAUTH_SUCCESS_REDIRECT_URL: ${OAUTH_SUCCESS_REDIRECT_URL}
      OAUTH_FAILURE_REDIRECT_URL: ${OAUTH_FAILURE_REDIRECT_URL}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - aether-network

  postgres:
    container_name: aether-postgres
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ntxcyber73
      POSTGRES_DB: aether

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aether"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - aether-network

  redis:
    container_name: aether-redis
    image: redis:7-alpine

    ports:
      - "6379:6379"

    networks:
      - aether-network

  livekit:
    container_name: aether-livekit
    image: livekit/livekit-server:latest

    command: --dev

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

    networks:
      - aether-network

  traefik:
    container_name: aether-traefik
    image: traefik:v3.6

    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - aether-network

volumes:
  postgres-data:
    external: true
    name: project-be_postgres-data

  app-logs:

networks:
  aether-network:
    driver: bridge
